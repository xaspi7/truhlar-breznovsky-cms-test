name: Initialize isolated CMS test repository
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run isolated CMS import after syntax fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone prepared CMS sandbox (read-only)
        run: git clone --depth=1 --branch cms-sandbox https://github.com/xaspi7/truhlar-breznovsky.git /tmp/breznovsky-cms-source
      - name: Copy full website including photographs
        run: rsync -a --exclude='.git' --exclude='.github/workflows/' /tmp/breznovsky-cms-source/ ./
      - name: Make sandbox independent and safe
        run: python3 .github/scripts/import_sandbox.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit fully isolated copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import standalone CMS test copy with assets and safe preview settings'
          git push origin HEAD:main
